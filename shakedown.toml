# Harnesses only. The skill under test is a path given to the entrypoint.

[harness.claude-code]
start = [
  "claude", "-p", "{prompt}",
  "--output-format", "stream-json", "--verbose",
  "--model", "{model}",
  "--allowedTools", "Bash", "Write", "Read", "Skill",
  "--permission-mode", "acceptEdits",
  "--setting-sources", "project",
  "--session-id", "{sid}",
]
resume = [
  "claude", "-p", "{reply}",
  "--output-format", "stream-json", "--verbose",
  "--model", "{model}",
  "--allowedTools", "Bash", "Write", "Read", "Skill",
  "--permission-mode", "acceptEdits",
  "--setting-sources", "project",
  "--resume", "{sid}",
]
skills = ".claude/skills"
activation_tool = "Skill"
dockerfile = "examples/docker/claude-code.Dockerfile"

[harness.claude-code.env]
HOME = "${HOME}"

[harness.claude-code.events]
container = "message.content"

# A second harness. Everything differs: the flags, where skills are
# discovered, the name of the activation tool, and the shape of the output.
# None of that reaches the skill under test.
[harness.gemini-cli]
start = [
  "gemini", "-p", "{prompt}",
  "--output-format", "stream-json",
  "--model", "{model}",
  "--approval-mode", "yolo",
  "--skip-trust",
  "--session-id", "{sid}",
]
resume = [
  "gemini", "-p", "{reply}",
  "--output-format", "stream-json",
  "--model", "{model}",
  "--approval-mode", "yolo",
  "--skip-trust",
  "--resume", "{sid}",
]
skills = ".gemini/skills"
activation_tool = "activate_skill"
dockerfile = "examples/docker/gemini-cli.Dockerfile"

[harness.gemini-cli.env]
HOME = "${HOME}"

# Flat records, not blocks nested under a message. Leaving `container`
# unset is what selects that shape.
[harness.gemini-cli.events]
discriminator = "type"
tool_marker   = "tool_use"
name_key      = "tool_name"
args_key      = "parameters"
text_marker   = "message"
text_key      = "content"

# The two harnesses below are worked examples of shapes the first two do
# not cover. Neither has a `[[matrix]]` entry, so neither runs: add one to
# measure against it.
#
# A third shape: the tool call is a top-level record, but its name and
# arguments sit under a `part` object rather than beside the discriminator.
# A key may therefore be a dotted path to one nested deeper in the block.
#
# opencode has no flag to set the session id, so the id shakedown generates
# never reaches it and `--continue` resumes instead. That is safe here
# because a sandbox is a fresh directory holding exactly one session.
[harness.opencode]
start = [
  "opencode", "run", "{prompt}",
  "--format", "json",
  "--model", "{model}",
  "--auto",
]
resume = [
  "opencode", "run", "{reply}",
  "--format", "json",
  "--model", "{model}",
  "--auto",
  "--continue",
]
skills = ".opencode/skills"
activation_tool = "skill"
dockerfile = "examples/docker/opencode.Dockerfile"

[harness.opencode.env]
HOME = "${HOME}"

[harness.opencode.events]
name_key = "part.tool"
args_key = "part.state.input"
text_key = "part.text"

# A harness that prints prose, not events. Hermes streams nothing
# machine-readable while it works, so the transcript is exported after the
# turn instead: `sessions export --format trace` writes Claude Code JSONL,
# which is why this block reuses that event shape unchanged.
#
# The oneshot's own output goes to stderr rather than /dev/null, so a run
# that fails for its own reasons says why instead of scoring as a skill
# that never fired.
#
# `HERMES_HOME` is relative, so it resolves inside the sandbox: skills,
# sessions, and config all land in the workspace. That is what makes
# `--continue` unambiguous and puts the seeded skill where Hermes looks,
# and it also means no host credentials are inherited — the API key below
# is the whole of what it gets.
[harness.hermes]
start = [
  "sh", "-c",
  "hermes -z \"$1\" --provider openrouter -m \"$2\" >&2 && hermes sessions export --format trace -",
  "hermes", "{prompt}", "{model}",
]
resume = [
  "sh", "-c",
  "hermes -c -z \"$1\" --provider openrouter -m \"$2\" >&2 && hermes sessions export --format trace -",
  "hermes", "{reply}", "{model}",
]
skills = ".hermes/skills"
activation_tool = "skill_view"
dockerfile = "examples/docker/hermes.Dockerfile"

[harness.hermes.env]
HOME = "${HOME}"
HERMES_HOME = ".hermes"
OPENROUTER_API_KEY = "${OPENROUTER_API_KEY}"

[harness.hermes.events]
container = "message.content"

[[matrix]]
harness = "claude-code"
models  = ["claude-opus-5"]

[[matrix]]
harness = "gemini-cli"
models  = ["gemini-3.6-flash"]

# The same harness, pointed at another provider. Claude Code speaks to
# whatever `ANTHROPIC_BASE_URL` names, so an Anthropic-shaped gateway in
# front of Ollama Cloud makes an open model a target like any other. The
# label is what keeps the two apart in the report; without it both rows
# would read `claude-code`.
#
# Needs `BIFROST_CC_VIRTUAL_KEY` in your environment. `shakedown` inherits
# nothing, so a variable the harness needs has to be declared here.
[[matrix]]
harness = "claude-code"
label   = "ollama-cloud"
models  = ["gpt-oss:120b"]

[matrix.env]
ANTHROPIC_BASE_URL   = "https://bifrost.lab.orangecluster.nl/anthropic"
ANTHROPIC_AUTH_TOKEN = "${BIFROST_CC_VIRTUAL_KEY}"
