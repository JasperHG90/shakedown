[project]
name = "skeval"
version = "0.1.0"
description = "Harness conformance testing for agent skills."
requires-python = ">=3.11"
dependencies = [
    "cachetools>=7.1.7",
    "pydantic>=2.13.4",
    "rich>=15.0.0",
    "stamina>=26.1.0",
    "testcontainers>=4.15.0",
    "typer>=0.27.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-cachetools>=7.0.0.20260713",
    "pytest-xdist>=3.8.0",
]

[project.scripts]
skeval = "skeval.cli:main"

[project.entry-points.pytest11]
skeval = "skeval.plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skeval"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "D1"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
files = ["src/skeval", "tests"]
strict = true

[tool.pytest.ini_options]
addopts = "-q -m 'not live'"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "live: spends real money against a real harness CLI; off by default, run with -m live",
]
