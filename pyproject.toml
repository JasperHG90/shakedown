[project]
name = "shakedown"
version = "0.1.0"
description = "Smoke-test agent skills across harnesses and models."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Jasper Ginn", email = "jasperginn@gmail.com" }]
requires-python = ">=3.11"
dependencies = [
    "cachetools>=7.1.7",
    "pydantic>=2.13.4",
    "rich>=15.0.0",
    "stamina>=26.1.0",
    "testcontainers>=4.15.0",
    "typer>=0.27.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-cachetools>=7.0.0.20260713",
    "pytest-xdist>=3.8.0",
    "pyyaml>=6.0.3",
    "types-pyyaml>=6.0.12.20260724",
]

[project.scripts]
shakedown = "shakedown.cli:main"

[project.entry-points.pytest11]
shakedown = "shakedown.plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shakedown"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "D1"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
# `plugins` is here because the hook scripts ship as files rather than as
# part of the package, and an unchecked script is exactly where a silent
# hook failure hides. The vendored copies are excluded rather than checked
# three times over: they are byte-identical to the original by test, and
# three modules of the same name is an error rather than more coverage.
files = ["src/shakedown", "tests", "plugins"]
exclude = "plugins/(claude-code|gemini)/"
strict = true

[tool.pytest.ini_options]
addopts = "-q -m 'not live'"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "live: spends real money against a real harness CLI; off by default, run with -m live",
]
