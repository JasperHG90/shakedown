name: shakedown
description: >-
  Smoke-test a skill on every harness you support. Runs the matrix,
  uploads the JSON report, and posts the scores to the pull request.
author: shakedown

branding:
  icon: check-circle
  color: purple

inputs:
  skill:
    description: Path to the skill under test (the directory holding SKILL.md).
    required: true
  config:
    description: Path to shakedown.toml. Defaults to discovery from the working directory.
    required: false
    default: ""
  harness:
    description: Only run targets whose label contains this.
    required: false
    default: ""
  case:
    description: Only run cases whose name contains this.
    required: false
    default: ""
  repeat:
    description: Runs per (target, case). More repeats, tighter numbers, more money.
    required: false
    default: ""
  parallel:
    description: Runs at a time. Every run is independent, so this is wall-clock only.
    required: false
    default: "1"
  sandbox:
    description: tmp or container. tmp is not isolated and the report says so.
    required: false
    default: tmp
  report:
    description: Where to write the JSON report.
    required: false
    default: shakedown-report.json
  python-version:
    description: Python used to run shakedown itself, not the harness.
    required: false
    default: "3.12"
  comment:
    description: Post the scores to the pull request. Ignored outside a PR.
    required: false
    default: "true"
  artifact-name:
    description: Name of the uploaded report artifact.
    required: false
    default: shakedown-report
  github-token:
    description: Token used to post the comment. Needs pull-requests write.
    required: false
    default: ${{ github.token }}

outputs:
  report:
    description: Path to the JSON report.
    value: ${{ inputs.report }}
  passed:
    description: Scenarios where nothing failed.
    value: ${{ steps.measure.outputs.passed }}
  failed:
    description: Scenarios with at least one failing check.
    value: ${{ steps.measure.outputs.failed }}
  markdown:
    description: The report rendered as markdown.
    value: ${{ steps.measure.outputs.markdown }}

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    # GITHUB_ACTION_PATH is this directory, and the package lives three
    # levels up at the repository root.
    - name: Install shakedown
      shell: bash
      run: |
        root=$(cd "$GITHUB_ACTION_PATH/../../.." && pwd)
        test -f "$root/pyproject.toml" || {
          echo "::error::no pyproject.toml at $root; the action moved relative to the package"
          exit 1
        }
        python -m pip install --disable-pip-version-check "$root"

    # Inputs reach the shell as environment variables rather than being
    # pasted into the script, so a value containing a quote stays a value.
    #
    # A failure here must not skip the report: a red run is exactly when the
    # numbers are worth reading. The exit code is carried to the last step.
    - name: Run the matrix
      id: measure
      shell: bash
      env:
        SHAKEDOWN_SKILL: ${{ inputs.skill }}
        SHAKEDOWN_CONFIG: ${{ inputs.config }}
        SHAKEDOWN_HARNESS: ${{ inputs.harness }}
        SHAKEDOWN_CASE: ${{ inputs.case }}
        SHAKEDOWN_REPEAT: ${{ inputs.repeat }}
        SHAKEDOWN_PARALLEL: ${{ inputs.parallel }}
        SHAKEDOWN_SANDBOX: ${{ inputs.sandbox }}
        SHAKEDOWN_REPORT: ${{ inputs.report }}
      run: |
        args=(run "$SHAKEDOWN_SKILL" --report "$SHAKEDOWN_REPORT"
              --sandbox "$SHAKEDOWN_SANDBOX" --parallel "$SHAKEDOWN_PARALLEL")
        if [ -n "$SHAKEDOWN_CONFIG" ]; then args+=(--config "$SHAKEDOWN_CONFIG"); fi
        if [ -n "$SHAKEDOWN_HARNESS" ]; then args+=(--harness "$SHAKEDOWN_HARNESS"); fi
        if [ -n "$SHAKEDOWN_CASE" ]; then args+=(--case "$SHAKEDOWN_CASE"); fi
        if [ -n "$SHAKEDOWN_REPEAT" ]; then args+=(--repeat "$SHAKEDOWN_REPEAT"); fi

        code=0
        shakedown "${args[@]}" || code=$?
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"

        if [ ! -f "$SHAKEDOWN_REPORT" ]; then
          echo "::error::shakedown wrote no report (exit $code), so nothing was measured."
          echo "::error::Run 'shakedown doctor' to find which prerequisite the harness fails."
          exit "${code:-1}"
        fi

        shakedown summary "$SHAKEDOWN_REPORT" > "$RUNNER_TEMP/shakedown.md"
        cat "$RUNNER_TEMP/shakedown.md" >> "$GITHUB_STEP_SUMMARY"

        python - <<'PY' >> "$GITHUB_OUTPUT"
        import json, os
        counts = json.load(open(os.environ["SHAKEDOWN_REPORT"]))["summary"]
        print(f"passed={counts['ok']}")
        print(f"failed={counts['failed']}")
        PY

        {
          echo "markdown<<SHAKEDOWN_EOF"
          cat "$RUNNER_TEMP/shakedown.md"
          echo "SHAKEDOWN_EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Upload the report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ inputs.report }}
        if-no-files-found: warn

    # Edits its own previous comment rather than adding one per push, which
    # is what makes this readable on a branch that gets iterated on.
    - name: Comment on the pull request
      if: always() && inputs.comment == 'true' && github.event_name == 'pull_request'
      uses: actions/github-script@v7
      env:
        SHAKEDOWN_MARKDOWN: ${{ steps.measure.outputs.markdown }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const body = process.env.SHAKEDOWN_MARKDOWN;
          if (!body) return;
          const marker = '<!-- shakedown-report -->';
          const target = {
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
          };

          const seen = await github.paginate(
            github.rest.issues.listComments, { ...target, per_page: 100 });
          const mine = seen.find((c) => c.body && c.body.includes(marker));

          if (mine) {
            await github.rest.issues.updateComment({
              owner: target.owner, repo: target.repo, comment_id: mine.id, body,
            });
          } else {
            await github.rest.issues.createComment({ ...target, body });
          }

    - name: Fail if the matrix failed
      if: always() && steps.measure.outputs.exit-code != '0'
      shell: bash
      env:
        SHAKEDOWN_EXIT: ${{ steps.measure.outputs.exit-code }}
      run: |
        echo "::error::shakedown exited $SHAKEDOWN_EXIT"
        exit "$SHAKEDOWN_EXIT"
