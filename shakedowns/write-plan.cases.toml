# The skill these cases measure. Cases are what a skill is held to rather
# than part of what ships, so they live out here and name their subject.
skill = "../examples/write-plan"

[[case]]
name     = "fully-specified"
prompt   = "Write a project plan. Title: Billing migration. Owner: platform-team."
artifact = "PLAN.md"
tool     = "planctl"

[[case]]
name     = "missing-owner"
prompt   = "Write a project plan titled Billing migration."
tool     = "planctl"

[[case.artifacts]]
path     = "PLAN.md"
contains = ["Billing migration"]

[[case.answers]]
match = "(?i)\\bowner\\b|who owns|who is responsible"
reply = "platform-team"
