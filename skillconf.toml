# The skill under test, and the deterministic CLI it must call.
[skill]
path = "examples/write-plan/skill"
name = "write-plan"
bin  = "examples/write-plan/bin"

repeat = 1

# --- harnesses -------------------------------------------------------------
#
# Seeded by COPY into the harness's own discovery path, not by a load-from-here
# flag: a probe found `--plugin-dir` reporting a loaded plugin whose skill was
# absent from the model's skill list. A copy is what a real user does.
#
# No `--safe-mode`. Its own help lists skills among the customizations it
# disables, which is the thing being measured. Isolation is the sandbox's job.

[harness.claude-code]
start  = "claude -p {prompt} --output-format stream-json --verbose --model {model} --allowedTools Bash Write Read Skill --permission-mode acceptEdits --setting-sources project --session-id {sid}"
resume = "claude -p {reply}  --output-format stream-json --verbose --model {model} --allowedTools Bash Write Read Skill --permission-mode acceptEdits --setting-sources project --resume {sid}"
skills = { dest = ".claude/skills/{name}" }
activation_tool = "Skill"

# Declared-only: the sandbox sees these and nothing else.
#
# HOME is here because this machine authenticates by OAuth, and the
# credentials live under it. That is a KNOWN LEAK: with HOME visible the
# harness also finds the developer's MCP servers and installed skills.
# `--setting-sources project` narrows it but does not close it (measured:
# 3 MCP servers still loaded). `doctor` reports what leaked rather than
# claiming isolation the tempdir backend cannot provide. The container
# backend closes it properly; that is the point of preferring one.
#
# If you authenticate by key instead, drop HOME and add:
#   ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY}"
[harness.claude-code.env]
HOME = "${HOME}"

[harness.claude-code.events]
container   = "message.content"
tool_marker = "tool_use"
name_key    = "name"
args_key    = "input"

[harness.claude-code.tools]
shell = "Bash"
write = "Write"
read  = "Read"

# --- matrix ----------------------------------------------------------------

[[matrix]]
harness = "claude-code"
models  = ["claude-opus-5"]

# --- cases -----------------------------------------------------------------

[[case]]
name     = "fully-specified"
prompt   = "Write a project plan. Title: Billing migration. Owner: platform-team."
artifact = "PLAN.md"

[[case]]
name     = "missing-owner"
prompt   = "Write a project plan titled Billing migration."
artifact = "PLAN.md"

  [[case.answers]]
  match = "(?i)\\bowner\\b|who owns|who is responsible"
  reply = "platform-team"
