[[case]]
name     = "specified"
prompt   = "Write a plan. owner: platform-team. title: billing."
artifact = "OUT.md"
tool     = "faketool"

[[case]]
name     = "missing-owner"
prompt   = "Write a plan. title: billing."
artifact = "OUT.md"
tool     = "faketool"

  [[case.answers]]
  match = "(?i)owner"
  reply = "platform-team"

[[case]]
name     = "missing-both"
prompt   = "Write a plan."
tool     = "faketool"

  [[case.artifacts]]
  path     = "OUT.md"
  contains = ["billing", "platform-team"]

  [[case.answers]]
  match = "(?i)owner"
  reply = "platform-team"

  [[case.answers]]
  match = "(?i)title"
  reply = "billing"
