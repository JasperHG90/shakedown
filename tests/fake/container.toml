[harness.fake]
start  = ["/work/bin/agent", "-p", "{prompt}", "--session-id", "{sid}"]
resume = ["/work/bin/agent", "-p", "{reply}", "--resume", "{sid}"]
skills = ".fake/skills"
activation_tool = "Skill"
image = "python:3.12-slim"

[harness.fake.env]
FAKE_COUNTER = "${FAKE_COUNTER}"

[harness.fake.events]
container = "message.content"

[[matrix]]
harness = "fake"
models  = ["m1"]
